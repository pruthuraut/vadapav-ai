services:
  bb-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: bb-harness:latest
    container_name: bb-harness
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    # Interactive REPL by default, or override with CLI args (e.g. -t example.com --run all)
